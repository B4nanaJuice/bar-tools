services:
  web:
    build: .

    ports:
      - "5000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://monuser:monpassword@db:5432/monapp

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18

    environment:
      POSTGRES_USER: monuser
      POSTGRES_PASSWORD: monpassword
      POSTGRES_DB: monapp

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monuser -d monapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: