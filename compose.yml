services:
  web:
    build: .
    container_name: web

    ports:
      - "80:8000"

    env_file: "web.env"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    container_name: db

    env_file: "db.env"

    volumes:
      - "postgres_data:/var/lib/postgresql"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monuser -d monapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: